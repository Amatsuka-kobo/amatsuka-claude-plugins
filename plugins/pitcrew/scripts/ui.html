<!doctype html>
<html lang="ja" data-config-theme="%PITCREW_THEME%">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pitcrew</title>
<style>
:root {
  --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --border: #e5e7eb;
  --pane: #f9fafb; --accent: #2563eb; --accent-fg: #ffffff;
  --badge-diff: #dbeafe; --badge-diff-fg: #1d4ed8;
  --badge-artifact: #dcfce7; --badge-artifact-fg: #15803d;
  --badge-test: #ffedd5; --badge-test-fg: #c2410c;
  --add: #16a34a; --add-bg: #f0fdf4; --del: #dc2626; --del-bg: #fef2f2;
  --hunk: #7c3aed; --hunk-bg: #f5f3ff;
}
html[data-theme="dark"] {
  --bg: #111827; --fg: #f3f4f6; --muted: #9ca3af; --border: #374151;
  --pane: #1f2937; --accent: #3b82f6; --accent-fg: #ffffff;
  --badge-diff: #1e3a5f; --badge-diff-fg: #93c5fd;
  --badge-artifact: #14432a; --badge-artifact-fg: #86efac;
  --badge-test: #4a2c17; --badge-test-fg: #fdba74;
  --add: #4ade80; --add-bg: #132a1a; --del: #f87171; --del-bg: #2f1516;
  --hunk: #a78bfa; --hunk-bg: #241b3a;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: system-ui, sans-serif; background: var(--bg);
  color: var(--fg); height: 100vh; display: flex; flex-direction: column;
}
#status-bar {
  display: flex; align-items: center; gap: 16px; padding: 8px 16px;
  border-bottom: 1px solid var(--border); font-size: 13px; flex-wrap: wrap;
}
#status-bar .stat b { font-variant-numeric: tabular-nums; }
#status-bar .spacer { flex: 1; }
#theme-toggle {
  border: 1px solid var(--border); background: var(--pane); color: var(--fg);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px;
}
main { display: flex; flex: 1; min-height: 0; }
#queue-pane {
  width: 340px; min-width: 240px; border-right: 1px solid var(--border);
  overflow-y: auto; background: var(--pane);
}
#queue-pane .section {
  padding: 6px 12px; font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.05em;
}
.queue-item {
  padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer;
  display: flex; flex-direction: column; gap: 4px;
}
.queue-item:hover { background: var(--bg); }
.queue-item.selected { background: var(--bg); box-shadow: inset 3px 0 var(--accent); }
.queue-item.reviewed { opacity: 0.5; }
.queue-item .row { display: flex; align-items: center; gap: 8px; }
.queue-item .title {
  font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.queue-item .meta { font-size: 11px; color: var(--muted); }
.badge {
  font-size: 10px; padding: 1px 7px; border-radius: 9999px; flex-shrink: 0;
}
.badge.diff { background: var(--badge-diff); color: var(--badge-diff-fg); }
.badge.artifact { background: var(--badge-artifact); color: var(--badge-artifact-fg); }
.badge.test { background: var(--badge-test); color: var(--badge-test-fg); }
.queue-item input[type="checkbox"] { flex-shrink: 0; margin: 0; }
#queue-pane .section { display: flex; align-items: center; gap: 8px; }
#queue-pane .section input[type="checkbox"] { margin: 0; }
#queue-pane .section .grow { flex: 1; }
#batch-approve {
  border: none; background: var(--accent); color: var(--accent-fg);
  border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 11px;
  text-transform: none; letter-spacing: normal;
}
#batch-approve:disabled { opacity: 0.4; cursor: default; }
#detail-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#detail-header {
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  border-bottom: 1px solid var(--border);
}
#detail-title { font-size: 14px; font-weight: 600; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#approve-btn {
  border: none; background: var(--accent); color: var(--accent-fg);
  border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px;
}
#approve-btn:disabled { opacity: 0.4; cursor: default; }
#detail-body {
  flex: 1; overflow: auto; margin: 0; padding: 16px; font-size: 12.5px;
  font-family: ui-monospace, monospace; white-space: pre-wrap;
  word-break: break-word;
}
#detail-body .add { color: var(--add); background: var(--add-bg); display: block; }
#detail-body .del { color: var(--del); background: var(--del-bg); display: block; }
#detail-body .hunk { color: var(--hunk); background: var(--hunk-bg); display: block; }
#comment-box {
  border-top: 1px solid var(--border); padding: 10px 16px; display: flex;
  flex-direction: column; gap: 8px; background: var(--pane);
}
#comment-body {
  width: 100%; min-height: 60px; resize: vertical; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg); color: var(--fg);
  padding: 8px; font-family: inherit; font-size: 13px;
}
#comment-box .row { display: flex; align-items: center; gap: 12px; }
#comment-send {
  border: none; background: var(--accent); color: var(--accent-fg);
  border-radius: 6px; padding: 6px 16px; cursor: pointer; font-size: 13px;
}
#config-toggle {
  border: 1px solid var(--border); background: var(--pane); color: var(--fg);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px;
}
#config-panel {
  border-bottom: 1px solid var(--border); padding: 12px 16px;
  background: var(--pane); display: flex; flex-direction: column; gap: 10px;
  font-size: 13px; max-height: 45vh; overflow-y: auto;
}
#config-panel .cfg-row { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
#config-panel .cfg-name { width: 140px; color: var(--muted); flex-shrink: 0; padding-top: 4px; }
#config-panel select, #config-panel input[type="number"] {
  border: 1px solid var(--border); background: var(--bg); color: var(--fg);
  border-radius: 6px; padding: 4px 8px; font-size: 13px;
}
#config-panel textarea {
  border: 1px solid var(--border); background: var(--bg); color: var(--fg);
  border-radius: 6px; padding: 6px 8px; font-size: 13px; width: 320px;
  min-height: 48px; resize: vertical; font-family: ui-monospace, monospace;
}
#cfg-save {
  border: none; background: var(--accent); color: var(--accent-fg);
  border-radius: 6px; padding: 6px 16px; cursor: pointer; font-size: 13px;
}
#cfg-msg { color: var(--muted); }
#toast {
  position: fixed; bottom: 16px; right: 16px; background: var(--fg);
  color: var(--bg); border-radius: 8px; padding: 10px 16px; font-size: 13px;
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
#toast.show { opacity: 1; }
.empty { padding: 24px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div id="status-bar">
  <span class="stat">実行: <b id="stat-run">-</b></span>
  <span class="stat" id="stat-phase-wrap" hidden>フェーズ: <b id="stat-phase">-</b></span>
  <span class="stat">未レビュー: <b id="stat-review">0</b></span>
  <span class="stat">未回収コメント: <b id="stat-comments">0</b></span>
  <span class="stat">最終捕捉: <b id="stat-capture">-</b></span>
  <span class="spacer"></span>
  <button id="config-toggle" type="button" title="設定">⚙ 設定</button>
  <button id="theme-toggle" type="button">テーマ: device</button>
</div>
<div id="config-panel" hidden>
  <div class="cfg-row">
    <label class="cfg-name" for="cfg-viewer">ビューア</label>
    <select id="cfg-viewer">
      <option value="files">files(エディタ直接)</option>
      <option value="browser">browser</option>
      <option value="tui">tui(後続ステージで実装予定)</option>
    </select>
  </div>
  <div class="cfg-row">
    <span class="cfg-name">捕捉対象</span>
    <label><input type="checkbox" id="cfg-target-diff" /> コード diff</label>
    <label><input type="checkbox" id="cfg-target-artifact" /> 成果物</label>
    <label><input type="checkbox" id="cfg-target-test" /> テスト・ビルド</label>
  </div>
  <div class="cfg-row">
    <label class="cfg-name" for="cfg-globs">成果物 glob</label>
    <textarea id="cfg-globs" placeholder="1 行 1 glob(例: docs/**/*.md)"></textarea>
  </div>
  <div class="cfg-row">
    <label class="cfg-name" for="cfg-commands">テストコマンド追加</label>
    <textarea id="cfg-commands" placeholder="1 行 1 コマンド接頭辞(例: deno test)"></textarea>
  </div>
  <div class="cfg-row">
    <label class="cfg-name" for="cfg-timing">注入タイミング</label>
    <select id="cfg-timing">
      <option value="hybrid">hybrid(推奨)</option>
      <option value="turn-boundary">turn-boundary</option>
      <option value="immediate">immediate</option>
    </select>
  </div>
  <div class="cfg-row">
    <label class="cfg-name" for="cfg-theme">テーマ初期値</label>
    <select id="cfg-theme">
      <option value="device">device</option>
      <option value="light">light</option>
      <option value="dark">dark</option>
    </select>
  </div>
  <div class="cfg-row">
    <label class="cfg-name" for="cfg-port">ポート</label>
    <input type="number" id="cfg-port" min="1" max="65535" />
  </div>
  <div class="cfg-row">
    <button id="cfg-save" type="button">保存</button>
    <span id="cfg-msg"></span>
  </div>
</div>
<main>
  <div id="queue-pane"></div>
  <div id="detail-pane">
    <div id="detail-header">
      <span id="detail-title">項目を選択してください</span>
      <button id="approve-btn" type="button" disabled>承認して既読</button>
    </div>
    <pre id="detail-body"></pre>
    <div id="comment-box">
      <textarea id="comment-body" placeholder="コメント(選択中の項目の paths / reviewId / base が自動で付きます。Ctrl+Enter で送信)"></textarea>
      <div class="row">
        <label><input type="radio" name="urgency" value="normal" checked /> 📮 通常</label>
        <label><input type="radio" name="urgency" value="urgent" /> 🚨 緊急</label>
        <span class="spacer" style="flex:1"></span>
        <button id="comment-send" type="button">送信</button>
      </div>
    </div>
  </div>
</main>
<div id="toast"></div>
<script>
"use strict";
(() => {
  const token = new URLSearchParams(location.search).get("token") || "";
  const headers = { authorization: "Bearer " + token };
  const $ = (id) => document.getElementById(id);

  // ---- テーマ(設計書 §5: localStorage > config > prefers-color-scheme) ----
  const THEMES = ["light", "dark", "device"];
  const media = matchMedia("(prefers-color-scheme: dark)");
  function themeChoice() {
    const saved = localStorage.getItem("pitcrew-theme");
    if (THEMES.includes(saved)) return saved;
    const config = document.documentElement.dataset.configTheme;
    return THEMES.includes(config) ? config : "device";
  }
  function applyTheme() {
    const choice = themeChoice();
    const effective = choice === "device" ? (media.matches ? "dark" : "light") : choice;
    document.documentElement.dataset.theme = effective;
    $("theme-toggle").textContent = "テーマ: " + choice;
  }
  $("theme-toggle").addEventListener("click", () => {
    const next = THEMES[(THEMES.indexOf(themeChoice()) + 1) % THEMES.length];
    localStorage.setItem("pitcrew-theme", next);
    applyTheme();
  });
  media.addEventListener("change", applyTheme);
  applyTheme();

  // ---- 状態 ----
  let state = null;
  let selected = null; // { status, name, id, paths, base, type }
  // 一括既読の選択状態。SSE 再描画・再接続後も維持される(描画時に Set を参照して復元)
  const checkedNames = new Set();

  function toast(message) {
    const el = $("toast");
    el.textContent = message;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 2500);
  }

  function ago(iso) {
    if (!iso) return "";
    const sec = Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 1000));
    if (sec < 60) return sec + "秒前";
    if (sec < 3600) return Math.floor(sec / 60) + "分前";
    return Math.floor(sec / 3600) + "時間前";
  }

  // ---- 一覧描画(textContent のみ使用。innerHTML 禁止) ----
  function renderItem(item) {
    const div = document.createElement("div");
    div.className = "queue-item " + item.status +
      (selected && selected.name === item.name && selected.status === item.status
        ? " selected" : "");
    const row = document.createElement("div");
    row.className = "row";
    if (item.status === "review") {
      const check = document.createElement("input");
      check.type = "checkbox";
      check.checked = checkedNames.has(item.name);
      // クリックで詳細表示(項目選択)が発火しないようにする
      check.addEventListener("click", (e) => e.stopPropagation());
      check.addEventListener("change", () => {
        if (check.checked) checkedNames.add(item.name);
        else checkedNames.delete(item.name);
        updateBatchControls();
      });
      row.append(check);
    }
    const badge = document.createElement("span");
    const type = ["diff", "artifact", "test"].includes(item.type) ? item.type : "diff";
    badge.className = "badge " + type;
    badge.textContent = item.type || "?";
    const title = document.createElement("span");
    title.className = "title";
    title.textContent = item.title;
    row.append(badge, title);
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = [item.agent, ago(item.created)].filter(Boolean).join(" · ");
    div.append(row, meta);
    div.addEventListener("click", () => select(item));
    return div;
  }

  // 「レビュー待ち」ヘッダー(全選択トグル + 一括既読ボタン)。renderQueue の肥大化を避けて分離
  function renderReviewHeader() {
    const label = document.createElement("div");
    label.className = "section";
    const selectAll = document.createElement("input");
    selectAll.type = "checkbox";
    selectAll.id = "select-all";
    selectAll.title = "全選択";
    const allNames = state.review.map((i) => i.name);
    selectAll.checked =
      allNames.length > 0 && allNames.every((n) => checkedNames.has(n));
    selectAll.addEventListener("change", () => {
      if (selectAll.checked) for (const n of allNames) checkedNames.add(n);
      else checkedNames.clear();
      renderQueue();
    });
    const text = document.createElement("span");
    text.textContent = "レビュー待ち";
    const grow = document.createElement("span");
    grow.className = "grow";
    const btn = document.createElement("button");
    btn.id = "batch-approve";
    btn.type = "button";
    btn.textContent = "選択を既読 (" + checkedNames.size + ")";
    btn.disabled = checkedNames.size === 0;
    btn.addEventListener("click", batchApprove);
    label.append(selectAll, text, grow, btn);
    return label;
  }

  // チェック変更時にヘッダーの表示だけを更新する(全再描画を避ける)
  function updateBatchControls() {
    const btn = $("batch-approve");
    const selectAll = $("select-all");
    if (!btn || !selectAll || !state) return;
    btn.textContent = "選択を既読 (" + checkedNames.size + ")";
    btn.disabled = checkedNames.size === 0;
    const allNames = state.review.map((i) => i.name);
    selectAll.checked =
      allNames.length > 0 && allNames.every((n) => checkedNames.has(n));
  }

  function renderQueue() {
    const pane = $("queue-pane");
    pane.textContent = "";
    if (!state || (state.review.length === 0 && state.reviewed.length === 0)) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "レビュー項目はまだありません。";
      pane.append(empty);
      return;
    }
    // review/ から消えた項目(既読化・注入で移動)は選択から外す
    if (state) {
      const present = new Set(state.review.map((i) => i.name));
      for (const n of [...checkedNames])
        if (!present.has(n)) checkedNames.delete(n);
    }
    if (state.review.length > 0) {
      pane.append(renderReviewHeader());
      for (const item of state.review) pane.append(renderItem(item));
    }
    if (state.reviewed.length > 0) {
      const label = document.createElement("div");
      label.className = "section";
      label.textContent = "レビュー済み";
      pane.append(label);
      for (const item of state.reviewed) pane.append(renderItem(item));
    }
  }

  function renderStatus() {
    if (!state) return;
    $("stat-run").textContent = state.hasRun
      ? "実行中(" + (state.startedAt || "") + " 開始)" : "記録なし";
    $("stat-phase-wrap").hidden = !state.phase;
    $("stat-phase").textContent = state.phase || "-";
    $("stat-review").textContent = String(state.review.length);
    $("stat-comments").textContent = String(state.openComments);
    $("stat-capture").textContent = state.lastCaptureAt
      ? ago(state.lastCaptureAt) : "-";
  }

  // ---- 詳細(diff は行頭記号で色分け。行は textContent で追加) ----
  function renderBody(text, isDiff) {
    const pre = $("detail-body");
    pre.textContent = "";
    if (!isDiff) {
      pre.textContent = text;
      return;
    }
    for (const line of text.split("\n")) {
      const span = document.createElement("span");
      if (line.startsWith("+") && !line.startsWith("+++")) span.className = "add";
      else if (line.startsWith("-") && !line.startsWith("---")) span.className = "del";
      else if (line.startsWith("@@")) span.className = "hunk";
      span.textContent = line + "\n";
      if (span.className) {
        // 行コメントの入口(設計書 §5): クリックで該当行を引用として挿入
        span.style.cursor = "pointer";
        span.title = "クリックでこの行を引用コメント";
        span.addEventListener("click", () => {
          const area = $("comment-body");
          area.value = (area.value === "" ? "" : area.value + "\n") +
            "> " + line + "\n";
          area.focus();
        });
      }
      pre.append(span);
    }
  }

  async function select(item) {
    selected = item;
    $("detail-title").textContent = item.title;
    $("approve-btn").disabled = item.status !== "review";
    renderQueue();
    try {
      const res = await fetch(
        "/api/item?status=" + encodeURIComponent(item.status) +
          "&name=" + encodeURIComponent(item.name),
        { headers }
      );
      if (!res.ok) throw new Error(String(res.status));
      const data = await res.json();
      renderBody(data.body, item.type === "diff");
    } catch {
      renderBody("(読み込みに失敗しました)", false);
    }
  }

  // ---- 操作 ----
  $("approve-btn").addEventListener("click", async () => {
    if (!selected || selected.status !== "review") return;
    const res = await fetch("/api/approve", {
      method: "POST",
      headers: { ...headers, "content-type": "application/json" },
      body: JSON.stringify({ name: selected.name })
    });
    if (res.ok) {
      toast("承認しました: " + selected.name);
      selected = { ...selected, status: "reviewed" };
      $("approve-btn").disabled = true;
      await refresh();
    } else toast("承認に失敗しました");
  });

  async function batchApprove() {
    const names = [...checkedNames];
    if (names.length === 0) return;
    if (!confirm("選択した " + names.length + " 件を既読にしますか?")) return;
    const res = await fetch("/api/approve-batch", {
      method: "POST",
      headers: { ...headers, "content-type": "application/json" },
      body: JSON.stringify({ names })
    });
    if (res.ok) {
      const data = await res.json();
      for (const n of data.moved) checkedNames.delete(n);
      toast(
        data.moved.length + " 件を既読にしました" +
          (data.failed.length > 0 ? "(" + data.failed.length + " 件失敗)" : "")
      );
      await refresh();
    } else toast("一括既読に失敗しました");
  }

  $("comment-send").addEventListener("click", async () => {
    const body = $("comment-body").value;
    if (body.trim() === "") {
      toast("コメント本文が空です");
      return;
    }
    const urgency = document.querySelector('input[name="urgency"]:checked').value;
    const payload = { body, urgency };
    if (selected) {
      payload.paths = selected.paths || [];
      if (selected.id) payload.reviewId = selected.id;
      if (selected.base) payload.base = selected.base;
    }
    const res = await fetch("/api/comment", {
      method: "POST",
      headers: { ...headers, "content-type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      const data = await res.json();
      $("comment-body").value = "";
      toast((urgency === "urgent" ? "🚨" : "📮") + " 送信しました: " + data.name);
      await refresh();
    } else toast("送信に失敗しました");
  });

  // Ctrl+Enter / Cmd+Enter で送信(送信経路を 1 本に保つため click() を呼ぶ。
  // 空本文ガードは click ハンドラ側がそのまま効く)
  $("comment-body").addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      $("comment-send").click();
    }
  });

  // ---- 設定パネル(Stage 4.2)----
  // 保存はサーバー側で検証してからアトミックに書かれる。hooks は短命
  // プロセスで毎回読み直すため次の hook 起動から反映。port / theme の
  // サーバー側反映のみ再起動(/pitcrew:serve restart)が必要。
  $("config-toggle").addEventListener("click", async () => {
    const panel = $("config-panel");
    if (!panel.hidden) {
      panel.hidden = true;
      return;
    }
    try {
      const res = await fetch("/api/config", { headers });
      if (!res.ok) throw new Error(String(res.status));
      fillConfigForm(await res.json());
      $("cfg-msg").textContent = "";
      panel.hidden = false;
    } catch {
      toast("設定の読み込みに失敗しました");
    }
  });

  function fillConfigForm(cfg) {
    $("cfg-viewer").value = cfg.viewer;
    $("cfg-target-diff").checked = cfg.captureTargets.diff;
    $("cfg-target-artifact").checked = cfg.captureTargets.artifact;
    $("cfg-target-test").checked = cfg.captureTargets.test;
    $("cfg-globs").value = cfg.artifactGlobs.join("\n");
    $("cfg-commands").value = cfg.testCommands.join("\n");
    $("cfg-timing").value = cfg.injectionTiming;
    $("cfg-theme").value = cfg.theme;
    $("cfg-port").value = String(cfg.port);
  }

  function splitLines(value) {
    return value.split("\n").map((s) => s.trim()).filter((s) => s !== "");
  }

  $("cfg-save").addEventListener("click", async () => {
    const payload = {
      viewer: $("cfg-viewer").value,
      captureTargets: {
        diff: $("cfg-target-diff").checked,
        artifact: $("cfg-target-artifact").checked,
        test: $("cfg-target-test").checked
      },
      artifactGlobs: splitLines($("cfg-globs").value),
      testCommands: splitLines($("cfg-commands").value),
      injectionTiming: $("cfg-timing").value,
      theme: $("cfg-theme").value,
      port: Number($("cfg-port").value)
    };
    try {
      const res = await fetch("/api/config", {
        method: "POST",
        headers: { ...headers, "content-type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        const data = await res.json();
        // config テーマの即時反映(localStorage の明示選択が優先される
        // 既存の優先順位は applyTheme() 側で維持される)
        document.documentElement.dataset.configTheme = payload.theme;
        applyTheme();
        let msg =
          "保存しました。捕捉・注入の設定は次の hook 起動から、" +
          "port / theme は次回のビューア起動(/pitcrew:serve restart)から反映されます。";
        if (data.gitignoreMissing.length > 0) {
          msg +=
            " " + data.gitignoreMissing.join(" と ") +
            " は .gitignore への追記を推奨します(/pitcrew:config で追記できます)。";
        }
        $("cfg-msg").textContent = msg;
        toast("設定を保存しました");
      } else {
        let field = "";
        try {
          field = ((await res.json()) || {}).error || "";
        } catch {}
        $("cfg-msg").textContent =
          "保存に失敗しました" + (field ? ": " + field + " が不正です" : "");
        toast("設定の保存に失敗しました");
      }
    } catch {
      toast("設定の保存に失敗しました");
    }
  });

  // ---- 同期(SSE + 再取得) ----
  async function refresh() {
    try {
      const res = await fetch("/api/state", { headers });
      if (!res.ok) return;
      state = await res.json();
      renderStatus();
      renderQueue();
    } catch {
      // サーバー停止中は次の SSE 再接続まで待つ
    }
  }

  function subscribe() {
    const es = new EventSource("/api/events?token=" + encodeURIComponent(token));
    es.onmessage = () => refresh();
    es.onerror = () => {
      es.close();
      setTimeout(subscribe, 5000);
    };
  }

  refresh();
  subscribe();
  setInterval(() => {
    renderStatus();
  }, 30000); // 経過時間表示の定期更新
})();
</script>
</body>
</html>
