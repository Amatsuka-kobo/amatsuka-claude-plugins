<!doctype html>
<html lang="en">
  <body>
    <a href="#target">Link</a>
    <button>Button</button>
    <input type="text" aria-label="Text field">
    <input type="search" aria-label="Search field">
    <input type="checkbox" aria-label="Checkbox">
    <input type="radio" aria-label="Radio">
    <select aria-label="Combobox"><option>Option</option></select>
    <div role="tablist"><div role="tab" aria-selected="true">Tab</div></div>
    <div role="menu"><div role="menuitem">Menu item</div></div>
    <div role="menu"><div role="menuitemcheckbox">Menu checkbox</div></div>
    <div role="menu"><div role="menuitemradio">Menu radio</div></div>
    <button role="switch" aria-checked="false">Switch</button>
    <div role="slider" aria-label="Slider" aria-valuemin="0" aria-valuemax="10" aria-valuenow="5"></div>
    <input type="number" aria-label="Spinbutton">
    <ul role="tree"><li role="treeitem">Tree item</li></ul>
  </body>
</html>
