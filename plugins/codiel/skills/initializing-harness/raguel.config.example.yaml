# raguel.config.yaml — Raguel 設定(内蔵デフォルトへの差分オーバーレイ)
# 解決順: 環境変数 RAGUEL_CONFIG のパス → raguel-mcp 起動時の cwd(通常はプロジェクトルート)/raguel.config.yaml → 内蔵デフォルト。
# ここに書いた値だけが内蔵デフォルトに深マージされる。デフォルト全量をコピーしないこと。
# 保護パスの globs はこのファイルを正本とする。他のファイルの記述と突き合わせない。
version: 1
rules:
  code/protected-paths:
    globs:
      - "prisma/migrations/**"
      - ".github/workflows/**"
      - "src/server/auth/**"
