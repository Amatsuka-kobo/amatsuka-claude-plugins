<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>受注管理システム ER図(サンプル)</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; }
  main { flex: 1; overflow: hidden; background: #fafafa; }
  svg { width: 100%; height: 100%; cursor: grab; }
  svg.panning { cursor: grabbing; }
  .node-box { fill: #fff; stroke: #333; }
  .node-header { fill: #e8eef7; stroke: #333; }
  .node-title { font-weight: bold; font-size: 13px; }
  .row { font-size: 12px; fill: #222; }
  .edge line, .edge polyline { stroke: #666; stroke-width: 1.5; fill: none; }
  .edge-label { font-size: 11px; fill: #444; }
  .node, .edge { transition: opacity .15s; }
  svg.has-selection .node:not(.hl), svg.has-selection .edge:not(.hl) { opacity: .25; }
  svg.has-hover .node:not(.pv):not(.hl), svg.has-hover .edge:not(.pv):not(.hl) { opacity: .5; }
  .hl .node-box, .pv .node-box { stroke: #1a63c9; stroke-width: 2; }
  .hl line, .pv line, .hl polyline, .pv polyline { stroke: #1a63c9; stroke-width: 2.5; }
  .zone rect { fill: #f5f5f5; stroke: #666; }
  .zone-label { font-size: 12px; font-weight: bold; fill: #444; }
  .lifeline { stroke: #999; stroke-dasharray: 6 4; }
  .edge.return line { stroke-dasharray: 6 4; }
  .node-header-fill { fill: #e8eef7; }
  #arrow path { fill: #666; }
  aside { width: 280px; border-left: 1px solid #ddd; padding: 12px; overflow-y: auto; background: #fff; }
  aside h2 { font-size: 14px; margin: 0 0 8px; }
  aside table { width: 100%; border-collapse: collapse; font-size: 12px; }
  aside td { border-bottom: 1px solid #eee; padding: 4px 2px; }
</style>
</head>
<body>
<main>
<svg id="canvas" viewBox="0 0 600 382" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#666"/></marker>
</defs>
<g id="zones">

</g>
<g id="lines">

</g>
<g id="edges">
<g class="edge" data-id="rel1" data-from="users" data-to="orders"><line x1="150" y1="288" x2="150" y2="94"/><text x="150" y="185" text-anchor="middle" class="edge-label">発注する 1:N</text></g>
<g class="edge" data-id="rel2" data-from="orders" data-to="order_items"><line x1="150" y1="94" x2="450" y2="107"/><text x="300" y="94.5" text-anchor="middle" class="edge-label">1:N</text></g>
<g class="edge" data-id="rel3" data-from="products" data-to="order_items"><line x1="450" y1="288" x2="450" y2="107"/><text x="450" y="191.5" text-anchor="middle" class="edge-label">1:N</text></g>
</g>
<g id="nodes">
<g class="node" data-id="orders" transform="translate(40,40)"><rect width="220" height="108" class="node-box"/><rect width="220" height="30" class="node-header"/><text x="110" y="15" text-anchor="middle" dominant-baseline="middle" class="node-title">注文(orders)</text><text x="8" y="43" dominant-baseline="middle" class="row">[PK] id : BIGINT</text><text x="8" y="69" dominant-baseline="middle" class="row">[FK] user_id : BIGINT</text><text x="8" y="95" dominant-baseline="middle" class="row">ordered_at : TIMESTAMP</text></g>
<g class="node" data-id="order_items" transform="translate(340,40)"><rect width="220" height="134" class="node-box"/><rect width="220" height="30" class="node-header"/><text x="110" y="15" text-anchor="middle" dominant-baseline="middle" class="node-title">注文明細(order_items)</text><text x="8" y="43" dominant-baseline="middle" class="row">[PK] id : BIGINT</text><text x="8" y="69" dominant-baseline="middle" class="row">[FK] order_id : BIGINT</text><text x="8" y="95" dominant-baseline="middle" class="row">[FK] product_id : BIGINT</text><text x="8" y="121" dominant-baseline="middle" class="row">quantity : INT</text></g>
<g class="node" data-id="users" transform="translate(40,234)"><rect width="220" height="108" class="node-box"/><rect width="220" height="30" class="node-header"/><text x="110" y="15" text-anchor="middle" dominant-baseline="middle" class="node-title">ユーザー(users)</text><text x="8" y="43" dominant-baseline="middle" class="row">[PK] id : BIGINT</text><text x="8" y="69" dominant-baseline="middle" class="row">[UQ] email : VARCHAR(255)</text><text x="8" y="95" dominant-baseline="middle" class="row">name : VARCHAR(100)</text></g>
<g class="node" data-id="products" transform="translate(340,234)"><rect width="220" height="108" class="node-box"/><rect width="220" height="30" class="node-header"/><text x="110" y="15" text-anchor="middle" dominant-baseline="middle" class="node-title">商品(products)</text><text x="8" y="43" dominant-baseline="middle" class="row">[PK] id : BIGINT</text><text x="8" y="69" dominant-baseline="middle" class="row">name : VARCHAR(200)</text><text x="8" y="95" dominant-baseline="middle" class="row">price : DECIMAL(10,2)</text></g>
</g>
</svg>
</main>
<aside id="panel" hidden>
<h2 id="panel-title"></h2>
<div id="panel-body"></div>
</aside>
<script type="application/json" id="design-spec">{"type":"er","title":"受注管理システム ER図(サンプル)","entities":[{"name":"users","label":"ユーザー","columns":[{"name":"id","type":"BIGINT","pk":true},{"name":"email","type":"VARCHAR(255)","unique":true},{"name":"name","type":"VARCHAR(100)"}]},{"name":"orders","label":"注文","columns":[{"name":"id","type":"BIGINT","pk":true},{"name":"user_id","type":"BIGINT","fk":true},{"name":"ordered_at","type":"TIMESTAMP"}]},{"name":"order_items","label":"注文明細","columns":[{"name":"id","type":"BIGINT","pk":true},{"name":"order_id","type":"BIGINT","fk":true},{"name":"product_id","type":"BIGINT","fk":true},{"name":"quantity","type":"INT"}]},{"name":"products","label":"商品","columns":[{"name":"id","type":"BIGINT","pk":true},{"name":"name","type":"VARCHAR(200)"},{"name":"price","type":"DECIMAL(10,2)"}]}],"relations":[{"from":"users","to":"orders","cardinality":"1:N","label":"発注する"},{"from":"orders","to":"order_items","cardinality":"1:N"},{"from":"products","to":"order_items","cardinality":"1:N"}]}</script>
<script type="application/json" id="design-layout">{"type":"er","title":"受注管理システム ER図(サンプル)","nodes":[{"id":"orders","label":"注文(orders)","x":0,"y":0,"width":220,"height":108,"headerHeight":30,"rowHeight":26,"rows":[{"text":"[PK] id : BIGINT","meta":{"name":"id","type":"BIGINT","pk":true}},{"text":"[FK] user_id : BIGINT","meta":{"name":"user_id","type":"BIGINT","fk":true}},{"text":"ordered_at : TIMESTAMP","meta":{"name":"ordered_at","type":"TIMESTAMP"}}]},{"id":"order_items","label":"注文明細(order_items)","x":300,"y":0,"width":220,"height":134,"headerHeight":30,"rowHeight":26,"rows":[{"text":"[PK] id : BIGINT","meta":{"name":"id","type":"BIGINT","pk":true}},{"text":"[FK] order_id : BIGINT","meta":{"name":"order_id","type":"BIGINT","fk":true}},{"text":"[FK] product_id : BIGINT","meta":{"name":"product_id","type":"BIGINT","fk":true}},{"text":"quantity : INT","meta":{"name":"quantity","type":"INT"}}]},{"id":"users","label":"ユーザー(users)","x":0,"y":194,"width":220,"height":108,"headerHeight":30,"rowHeight":26,"rows":[{"text":"[PK] id : BIGINT","meta":{"name":"id","type":"BIGINT","pk":true}},{"text":"[UQ] email : VARCHAR(255)","meta":{"name":"email","type":"VARCHAR(255)","unique":true}},{"text":"name : VARCHAR(100)","meta":{"name":"name","type":"VARCHAR(100)"}}]},{"id":"products","label":"商品(products)","x":300,"y":194,"width":220,"height":108,"headerHeight":30,"rowHeight":26,"rows":[{"text":"[PK] id : BIGINT","meta":{"name":"id","type":"BIGINT","pk":true}},{"text":"name : VARCHAR(200)","meta":{"name":"name","type":"VARCHAR(200)"}},{"text":"price : DECIMAL(10,2)","meta":{"name":"price","type":"DECIMAL(10,2)"}}]}],"edges":[{"id":"rel1","from":"users","to":"orders","label":"発注する","cardinality":"1:N"},{"id":"rel2","from":"orders","to":"order_items","label":"","cardinality":"1:N"},{"id":"rel3","from":"products","to":"order_items","label":"","cardinality":"1:N"}]}</script>
<script>
(() => {
  const svg = document.getElementById('canvas');
  const layout = JSON.parse(document.getElementById('design-layout').textContent);
  const panel = document.getElementById('panel');
  const panelTitle = document.getElementById('panel-title');
  const panelBody = document.getElementById('panel-body');
  const vb = svg.viewBox.baseVal;

  // --- ズーム(ポインタ位置を中心に) ---
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const scale = e.deltaY < 0 ? 0.9 : 1.1;
    const rect = svg.getBoundingClientRect();
    const px = vb.x + ((e.clientX - rect.left) / rect.width) * vb.width;
    const py = vb.y + ((e.clientY - rect.top) / rect.height) * vb.height;
    vb.x = px - (px - vb.x) * scale;
    vb.y = py - (py - vb.y) * scale;
    vb.width *= scale;
    vb.height *= scale;
  }, { passive: false });

  // --- パン(ドラッグ) ---
  let drag = null;
  svg.addEventListener('pointerdown', (e) => {
    drag = { cx: e.clientX, cy: e.clientY, vx: vb.x, vy: vb.y, moved: false };
    svg.classList.add('panning');
  });
  window.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const rect = svg.getBoundingClientRect();
    const dx = ((e.clientX - drag.cx) / rect.width) * vb.width;
    const dy = ((e.clientY - drag.cy) / rect.height) * vb.height;
    if (Math.abs(e.clientX - drag.cx) + Math.abs(e.clientY - drag.cy) > 3) drag.moved = true;
    vb.x = drag.vx - dx;
    vb.y = drag.vy - dy;
  });
  window.addEventListener('pointerup', () => {
    svg.classList.remove('panning');
    setTimeout(() => { drag = null; }, 0);
  });

  // --- 接続集合の計算 ---
  function connected(g) {
    const set = new Set([g]);
    if (g.classList.contains('node')) {
      const id = g.dataset.id;
      svg.querySelectorAll('.edge').forEach((eg) => {
        if (eg.dataset.from === id || eg.dataset.to === id) {
          set.add(eg);
          const otherId = eg.dataset.from === id ? eg.dataset.to : eg.dataset.from;
          const other = svg.querySelector('.node[data-id="' + CSS.escape(otherId) + '"]');
          if (other) set.add(other);
        }
      });
    } else {
      for (const key of ['from', 'to']) {
        const n = svg.querySelector('.node[data-id="' + CSS.escape(g.dataset[key]) + '"]');
        if (n) set.add(n);
      }
    }
    return set;
  }

  // --- 選択(クリック) ---
  function clearSelection() {
    svg.classList.remove('has-selection');
    svg.querySelectorAll('.hl').forEach((el) => el.classList.remove('hl'));
    panel.hidden = true;
  }
  svg.addEventListener('click', (e) => {
    if (drag && drag.moved) return; // パン後のクリックは無視
    const g = e.target.closest('.node, .edge');
    clearSelection();
    if (!g) return;
    svg.classList.add('has-selection');
    connected(g).forEach((el) => el.classList.add('hl'));
    showPanel(g);
  });

  // --- ホバー(プレビュー) ---
  svg.addEventListener('pointerover', (e) => {
    const g = e.target.closest('.node, .edge');
    if (!g) return;
    svg.classList.add('has-hover');
    connected(g).forEach((el) => el.classList.add('pv'));
  });
  svg.addEventListener('pointerout', () => {
    svg.classList.remove('has-hover');
    svg.querySelectorAll('.pv').forEach((el) => el.classList.remove('pv'));
  });

  // --- 詳細パネル(レイアウト JSON から図種非依存に描画) ---
  function showPanel(g) {
    panel.hidden = false;
    panelBody.textContent = '';
    if (g.classList.contains('node')) {
      const node = layout.nodes.find((n) => n.id === g.dataset.id);
      panelTitle.textContent = node.label;
      const table = document.createElement('table');
      if (node.rows) {
        for (const row of node.rows) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.textContent = row.text;
          tr.appendChild(td);
          table.appendChild(tr);
        }
      } else {
        for (const [k, v] of Object.entries(node.meta ?? {})) {
          if (v === '' || v === undefined) continue;
          const tr = document.createElement('tr');
          const td1 = document.createElement('td');
          const td2 = document.createElement('td');
          td1.textContent = k;
          td2.textContent = String(v);
          tr.append(td1, td2);
          table.appendChild(tr);
        }
      }
      panelBody.appendChild(table);
    } else {
      const edge = layout.edges.find((ed) => ed.id === g.dataset.id);
      panelTitle.textContent = edge.label || edge.id;
      const dl = document.createElement('table');
      const fields = [['from', edge.from], ['to', edge.to]];
      if (edge.cardinality) fields.push(['cardinality', edge.cardinality]);
      if (edge.style) fields.push(['style', edge.style]);
      for (const [k, v] of fields) {
        const tr = document.createElement('tr');
        const td1 = document.createElement('td');
        const td2 = document.createElement('td');
        td1.textContent = k;
        td2.textContent = v || '';
        tr.append(td1, td2);
        dl.appendChild(tr);
      }
      panelBody.appendChild(dl);
    }
  }
})();
</script>
</body>
</html>
