<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Web システム構成図(サンプル)</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; }
  main { flex: 1; overflow: hidden; background: #fafafa; }
  svg { width: 100%; height: 100%; cursor: grab; }
  svg.panning { cursor: grabbing; }
  .node-box { fill: #fff; stroke: #333; }
  .node-header { fill: #e8eef7; stroke: #333; }
  .node-title { font-weight: bold; font-size: 13px; }
  .row { font-size: 12px; fill: #222; }
  .edge line, .edge polyline { stroke: #666; stroke-width: 1.5; fill: none; }
  .edge-label { font-size: 11px; fill: #444; }
  .node, .edge { transition: opacity .15s; }
  svg.has-selection .node:not(.hl), svg.has-selection .edge:not(.hl) { opacity: .25; }
  svg.has-hover .node:not(.pv):not(.hl), svg.has-hover .edge:not(.pv):not(.hl) { opacity: .5; }
  .hl .node-box, .pv .node-box { stroke: #1a63c9; stroke-width: 2; }
  .hl line, .pv line, .hl polyline, .pv polyline { stroke: #1a63c9; stroke-width: 2.5; }
  .zone rect { fill: #f5f5f5; stroke: #666; }
  .zone-label { font-size: 12px; font-weight: bold; fill: #444; }
  .lifeline { stroke: #999; stroke-dasharray: 6 4; }
  .edge.return line { stroke-dasharray: 6 4; }
  .node-header-fill { fill: #e8eef7; }
  #arrow path { fill: #666; }
  aside { width: 280px; border-left: 1px solid #ddd; padding: 12px; overflow-y: auto; background: #fff; }
  aside h2 { font-size: 14px; margin: 0 0 8px; }
  aside table { width: 100%; border-collapse: collapse; font-size: 12px; }
  aside td { border-bottom: 1px solid #eee; padding: 4px 2px; }
</style>
</head>
<body>
<main>
<svg id="canvas" viewBox="0 0 820 310" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#666"/></marker>
</defs>
<g id="zones">
<g class="zone"><rect x="40" y="40" width="360" height="230"/><text x="48" y="58" class="zone-label">AWS</text></g>
</g>
<g id="lines">

</g>
<g id="edges">
<g class="edge arrow" data-id="e1" data-from="browser" data-to="cdn"><polyline points="600,100 640,100" fill="none" marker-end="url(#arrow)"/><text x="620" y="94" text-anchor="middle" class="edge-label">HTTPS</text></g>
<g class="edge arrow" data-id="e2" data-from="browser" data-to="alb"><polyline points="460,100 460,58 200,58 200,120" fill="none" marker-end="url(#arrow)"/><text x="330" y="52" text-anchor="middle" class="edge-label">HTTPS</text></g>
<g class="edge arrow" data-id="e3" data-from="alb" data-to="web"><polyline points="200,120 240,120" fill="none" marker-end="url(#arrow)"/><text x="220" y="114" text-anchor="middle" class="edge-label">HTTP</text></g>
<g class="edge arrow" data-id="e4" data-from="web" data-to="app"><polyline points="240,120 220,120 220,220 200,220" fill="none" marker-end="url(#arrow)"/><text x="220" y="164" text-anchor="middle" class="edge-label">HTTP</text></g>
<g class="edge arrow" data-id="e5" data-from="app" data-to="db"><polyline points="200,220 240,220" fill="none" marker-end="url(#arrow)"/><text x="220" y="214" text-anchor="middle" class="edge-label">SQL</text></g>
</g>
<g id="nodes">
<g class="node" data-id="alb" transform="translate(60,90)"><rect width="140" height="60" rx="8" class="node-box"/><text x="70" y="30" text-anchor="middle" dominant-baseline="middle" class="node-title">ALB</text></g>
<g class="node" data-id="web" transform="translate(240,90)"><rect width="140" height="60" rx="8" class="node-box"/><text x="70" y="30" text-anchor="middle" dominant-baseline="middle" class="node-title">Web Server</text></g>
<g class="node" data-id="app" transform="translate(60,190)"><rect width="140" height="60" rx="8" class="node-box"/><text x="70" y="30" text-anchor="middle" dominant-baseline="middle" class="node-title">App Server</text></g>
<g class="node" data-id="db" transform="translate(240,190)"><rect width="140" height="60" rx="8" class="node-box"/><text x="70" y="30" text-anchor="middle" dominant-baseline="middle" class="node-title">PostgreSQL</text></g>
<g class="node" data-id="browser" transform="translate(460,70)"><rect width="140" height="60" rx="8" class="node-box"/><text x="70" y="30" text-anchor="middle" dominant-baseline="middle" class="node-title">ブラウザ</text></g>
<g class="node" data-id="cdn" transform="translate(640,70)"><rect width="140" height="60" rx="8" class="node-box"/><text x="70" y="30" text-anchor="middle" dominant-baseline="middle" class="node-title">CDN</text></g>
</g>
</svg>
</main>
<aside id="panel" hidden>
<h2 id="panel-title"></h2>
<div id="panel-body"></div>
</aside>
<script type="application/json" id="design-spec">{"type":"architecture","title":"Web システム構成図(サンプル)","zones":[{"id":"aws","label":"AWS","children":["alb","web","app","db"]}],"nodes":[{"id":"browser","label":"ブラウザ"},{"id":"cdn","label":"CDN"},{"id":"alb","label":"ALB"},{"id":"web","label":"Web Server","icon":"server"},{"id":"app","label":"App Server","icon":"server"},{"id":"db","label":"PostgreSQL","icon":"database"}],"edges":[{"from":"browser","to":"cdn","label":"HTTPS"},{"from":"browser","to":"alb","label":"HTTPS"},{"from":"alb","to":"web","label":"HTTP"},{"from":"web","to":"app","label":"HTTP"},{"from":"app","to":"db","label":"SQL"}]}</script>
<script type="application/json" id="design-layout">{"type":"architecture","title":"Web システム構成図(サンプル)","zones":[{"id":"aws","label":"AWS","x":0,"y":0,"width":360,"height":230}],"nodes":[{"id":"alb","label":"ALB","shape":"box","x":20,"y":50,"width":140,"height":60,"meta":{"icon":"","zone":"aws"}},{"id":"web","label":"Web Server","shape":"box","x":200,"y":50,"width":140,"height":60,"meta":{"icon":"server","zone":"aws"}},{"id":"app","label":"App Server","shape":"box","x":20,"y":150,"width":140,"height":60,"meta":{"icon":"server","zone":"aws"}},{"id":"db","label":"PostgreSQL","shape":"box","x":200,"y":150,"width":140,"height":60,"meta":{"icon":"database","zone":"aws"}},{"id":"browser","label":"ブラウザ","shape":"box","x":420,"y":30,"width":140,"height":60,"meta":{"icon":"","zone":""}},{"id":"cdn","label":"CDN","shape":"box","x":600,"y":30,"width":140,"height":60,"meta":{"icon":"","zone":""}}],"edges":[{"id":"e1","from":"browser","to":"cdn","label":"HTTPS","style":"arrow"},{"id":"e2","from":"browser","to":"alb","label":"HTTPS","style":"arrow"},{"id":"e3","from":"alb","to":"web","label":"HTTP","style":"arrow"},{"id":"e4","from":"web","to":"app","label":"HTTP","style":"arrow"},{"id":"e5","from":"app","to":"db","label":"SQL","style":"arrow"}]}</script>
<script>
(() => {
  const svg = document.getElementById('canvas');
  const layout = JSON.parse(document.getElementById('design-layout').textContent);
  const panel = document.getElementById('panel');
  const panelTitle = document.getElementById('panel-title');
  const panelBody = document.getElementById('panel-body');
  const vb = svg.viewBox.baseVal;

  // --- ズーム(ポインタ位置を中心に) ---
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const scale = e.deltaY < 0 ? 0.9 : 1.1;
    const rect = svg.getBoundingClientRect();
    const px = vb.x + ((e.clientX - rect.left) / rect.width) * vb.width;
    const py = vb.y + ((e.clientY - rect.top) / rect.height) * vb.height;
    vb.x = px - (px - vb.x) * scale;
    vb.y = py - (py - vb.y) * scale;
    vb.width *= scale;
    vb.height *= scale;
  }, { passive: false });

  // --- パン(ドラッグ) ---
  let drag = null;
  svg.addEventListener('pointerdown', (e) => {
    drag = { cx: e.clientX, cy: e.clientY, vx: vb.x, vy: vb.y, moved: false };
    svg.classList.add('panning');
  });
  window.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const rect = svg.getBoundingClientRect();
    const dx = ((e.clientX - drag.cx) / rect.width) * vb.width;
    const dy = ((e.clientY - drag.cy) / rect.height) * vb.height;
    if (Math.abs(e.clientX - drag.cx) + Math.abs(e.clientY - drag.cy) > 3) drag.moved = true;
    vb.x = drag.vx - dx;
    vb.y = drag.vy - dy;
  });
  window.addEventListener('pointerup', () => {
    svg.classList.remove('panning');
    setTimeout(() => { drag = null; }, 0);
  });

  // --- 接続集合の計算 ---
  function connected(g) {
    const set = new Set([g]);
    if (g.classList.contains('node')) {
      const id = g.dataset.id;
      svg.querySelectorAll('.edge').forEach((eg) => {
        if (eg.dataset.from === id || eg.dataset.to === id) {
          set.add(eg);
          const otherId = eg.dataset.from === id ? eg.dataset.to : eg.dataset.from;
          const other = svg.querySelector('.node[data-id="' + CSS.escape(otherId) + '"]');
          if (other) set.add(other);
        }
      });
    } else {
      for (const key of ['from', 'to']) {
        const n = svg.querySelector('.node[data-id="' + CSS.escape(g.dataset[key]) + '"]');
        if (n) set.add(n);
      }
    }
    return set;
  }

  // --- 選択(クリック) ---
  function clearSelection() {
    svg.classList.remove('has-selection');
    svg.querySelectorAll('.hl').forEach((el) => el.classList.remove('hl'));
    panel.hidden = true;
  }
  svg.addEventListener('click', (e) => {
    if (drag && drag.moved) return; // パン後のクリックは無視
    const g = e.target.closest('.node, .edge');
    clearSelection();
    if (!g) return;
    svg.classList.add('has-selection');
    connected(g).forEach((el) => el.classList.add('hl'));
    showPanel(g);
  });

  // --- ホバー(プレビュー) ---
  svg.addEventListener('pointerover', (e) => {
    const g = e.target.closest('.node, .edge');
    if (!g) return;
    svg.classList.add('has-hover');
    connected(g).forEach((el) => el.classList.add('pv'));
  });
  svg.addEventListener('pointerout', () => {
    svg.classList.remove('has-hover');
    svg.querySelectorAll('.pv').forEach((el) => el.classList.remove('pv'));
  });

  // --- 詳細パネル(レイアウト JSON から図種非依存に描画) ---
  function showPanel(g) {
    panel.hidden = false;
    panelBody.textContent = '';
    if (g.classList.contains('node')) {
      const node = layout.nodes.find((n) => n.id === g.dataset.id);
      panelTitle.textContent = node.label;
      const table = document.createElement('table');
      if (node.rows) {
        for (const row of node.rows) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.textContent = row.text;
          tr.appendChild(td);
          table.appendChild(tr);
        }
      } else {
        for (const [k, v] of Object.entries(node.meta ?? {})) {
          if (v === '' || v === undefined) continue;
          const tr = document.createElement('tr');
          const td1 = document.createElement('td');
          const td2 = document.createElement('td');
          td1.textContent = k;
          td2.textContent = String(v);
          tr.append(td1, td2);
          table.appendChild(tr);
        }
      }
      panelBody.appendChild(table);
    } else {
      const edge = layout.edges.find((ed) => ed.id === g.dataset.id);
      panelTitle.textContent = edge.label || edge.id;
      const dl = document.createElement('table');
      const fields = [['from', edge.from], ['to', edge.to]];
      if (edge.cardinality) fields.push(['cardinality', edge.cardinality]);
      if (edge.style) fields.push(['style', edge.style]);
      for (const [k, v] of fields) {
        const tr = document.createElement('tr');
        const td1 = document.createElement('td');
        const td2 = document.createElement('td');
        td1.textContent = k;
        td2.textContent = v || '';
        tr.append(td1, td2);
        dl.appendChild(tr);
      }
      panelBody.appendChild(dl);
    }
  }
})();
</script>
</body>
</html>
