<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Web システム構成図(サンプル)</title>
<style>
:root{color-scheme:light;}
*{box-sizing:border-box;}
body{margin:0;font-family:system-ui, sans-serif;display:flex;height:100vh;}
main{flex:1;overflow:hidden;background:#F1F5F9;}
svg{width:100%;height:100%;cursor:grab;}
svg.panning{cursor:grabbing;}
.kind-generic{--fill:#F8FAFC;--stroke:#64748B;--icon:#475569;--text:#0F172A;}.kind-user{--fill:#EFF6FF;--stroke:#3B82F6;--icon:#2563EB;--text:#1E3A8A;}.kind-api{--fill:#ECFEFF;--stroke:#0891B2;--icon:#0E7490;--text:#164E63;}.kind-data{--fill:#F5F3FF;--stroke:#8B5CF6;--icon:#7C3AED;--text:#4C1D95;}.kind-messaging{--fill:#FFF7ED;--stroke:#F97316;--icon:#EA580C;--text:#7C2D12;}.kind-external{--fill:#FDF2F8;--stroke:#DB2777;--icon:#BE185D;--text:#831843;}.kind-screen{--fill:#F0FDF4;--stroke:#22C55E;--icon:#16A34A;--text:#14532D;}.kind-entity{--fill:#FFFBEB;--stroke:#D97706;--icon:#B45309;--text:#78350F;}
.node-card{fill:var(--fill,#F8FAFC);stroke:var(--stroke,#64748B);stroke-width:1.5;filter:url(#soft-shadow);}
.node-header{fill:var(--stroke,#64748B);opacity:.12;}
.node-title{font-weight:600;font-size:13px;fill:var(--text,#0F172A);}
.node-icon svg{width:24px;height:24px;color:var(--icon,#475569);}
.row-bg{fill:transparent;}
.row-text{font-size:12px;fill:#1F2937;}.badge{font-weight:700}.badge-pk{fill:#F59E0B}.badge-fk{fill:#8B5CF6}.badge-unique{fill:#0EA5E9}
.edge polyline{stroke:#475569;stroke-width:1.5;fill:none;}
.edge.return polyline{stroke-dasharray:6 4;}
.edge-label-bg{fill:#FFFFFF;stroke:#E2E8F0;}
.edge-label text{font-size:11px;fill:#334155;}
.node,.edge{transition:opacity .15s;}
svg.has-selection .node:not(.hl),svg.has-selection .edge:not(.hl){opacity:.25;}
svg.has-hover .node:not(.pv):not(.hl),svg.has-hover .edge:not(.pv):not(.hl){opacity:.5;}
.hl .node-card,.pv .node-card{stroke-width:2.5;}
.hl polyline,.pv polyline{stroke:#1a63c9;stroke-width:2.5;}
.zone-bg{fill:#F8FAFC;stroke:#CBD5E1;}
.zone-chip-bg{fill:#E2E8F0;}
.zone-chip-text{font-size:12px;font-weight:600;fill:#334155;}
.lifeline{stroke:#94A3B8;stroke-dasharray:6 4;}
aside{width:280px;border-left:1px solid #E2E8F0;padding:16px;overflow-y:auto;background:#fff;}
aside h2{font-size:14px;margin:0 0 12px;}
aside table{width:100%;border-collapse:collapse;font-size:12px;}
aside td{border-bottom:1px solid #F1F5F9;padding:6px 4px;}
</style>
</head>

<g class="node" data-id="db" transform="translate(56,1009)"><rect class="node-card kind-data" width="160" height="68" rx="12"/><g class="node-icon" transform="translate(10,22)"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="6" rx="7" ry="3" /><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6" /><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3" /></svg></g><text class="node-title" x="42" y="34" dominant-baseline="middle">PostgreSQL</text></g>
<g class="node" data-id="browser" transform="translate(82.66666666666666,28)"><rect class="node-card kind-generic" width="160" height="68" rx="12"/><g class="node-icon" transform="translate(10,22)"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4" /></svg></g><text class="node-title" x="42" y="34" dominant-baseline="middle">ブラウザ</text></g>
<g class="node" data-id="cdn" transform="translate(300,267)"><rect class="node-card kind-generic" width="160" height="68" rx="12"/><g class="node-icon" transform="translate(10,22)"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4" /></svg></g><text class="node-title" x="42" y="34" dominant-baseline="middle">CDN</text></g>
</g>
</g>
</svg>
</main>
<aside id="panel" hidden>

<script type="application/json" id="design-spec">{"type":"architecture","title":"Web システム構成図(サンプル)","zones":[{"id":"aws","label":"AWS","children":["alb","web","app","db"]}],"nodes":[{"id":"browser","label":"ブラウザ"},{"id":"cdn","label":"CDN"},{"id":"alb","label":"ALB"},{"id":"web","label":"Web Server","icon":"server"},{"id":"app","label":"App Server","icon":"server"},{"id":"db","label":"PostgreSQL","icon":"database"}],"edges":[{"from":"browser","to":"cdn","label":"HTTPS"},{"from":"browser","to":"alb","label":"HTTPS"},{"from":"alb","to":"web","label":"HTTP"},{"from":"web","to":"app","label":"HTTP"},{"from":"app","to":"db","label":"SQL"}]}</script>
<script type="application/json" id="design-layout">{"type":"architecture","title":"Web システム構成図(サンプル)","zones":[{"id":"aws","label":"AWS","x":28,"y":267,"width":216,"height":838}],"nodes":[{"id":"alb","label":"ALB","shape":"box","kindKey":"generic","x":56,"y":319,"width":160,"height":68,"meta":{"icon":"","zone":"aws"}},{"id":"web","label":"Web Server","shape":"box","kindKey":"generic","x":56,"y":549,"width":160,"height":68,"meta":{"icon":"server","zone":"aws"}},{"id":"app","label":"App Server","shape":"box","kindKey":"generic","x":56,"y":779,"width":160,"height":68,"meta":{"icon":"server","zone":"aws"}},{"id":"db","label":"PostgreSQL","shape":"box","kindKey":"data","x":56,"y":1009,"width":160,"height":68,"meta":{"icon":"database","zone":"aws"}},{"id":"browser","label":"ブラウザ","shape":"box","kindKey":"generic","x":82.66666666666666,"y":28,"width":160,"height":68,"meta":{"icon":"","zone":""}},{"id":"cdn","label":"CDN","shape":"box","kindKey":"generic","x":300,"y":267,"width":160,"height":68,"meta":{"icon":"","zone":""}}],"edges":[{"id":"e1","from":"browser","to":"cdn","label":"HTTPS","style":"arrow","points":[{"x":189.333,"y":96},{"x":189.333,"y":106},{"x":380,"y":106},{"x":380,"y":267}],"labelBox":{"x":383,"y":168,"width":51,"height":18}},{"id":"e2","from":"browser","to":"alb","label":"HTTPS","style":"arrow","points":[{"x":136,"y":96},{"x":136,"y":319}],"labelBox":{"x":83,"y":168,"width":51,"height":18}},{"id":"e3","from":"alb","to":"web","label":"HTTP","style":"arrow","points":[{"x":136,"y":387},{"x":136,"y":549}],"labelBox":{"x":86,"y":459,"width":48,"height":18}},{"id":"e4","from":"web","to":"app","label":"HTTP","style":"arrow","points":[{"x":136,"y":617},{"x":136,"y":779}],"labelBox":{"x":86,"y":689,"width":48,"height":18}},{"id":"e5","from":"app","to":"db","label":"SQL","style":"arrow","points":[{"x":136,"y":847},{"x":136,"y":1009}],"labelBox":{"x":86,"y":919,"width":48,"height":18}}]}</script>
<script>
(() => {
  const svg = document.getElementById("canvas")
  const layout = JSON.parse(document.getElementById("design-layout").textContent)
  const panel = document.getElementById("panel")
  const panelTitle = document.getElementById("panel-title")
  const panelBody = document.getElementById("panel-body")
  const vb = svg.viewBox.baseVal

  function onWheel(e) {
    e.preventDefault()
    const scale = e.deltaY < 0 ? 0.9 : 1.1
    const rect = svg.getBoundingClientRect()
    const px = vb.x + ((e.clientX - rect.left) / rect.width) * vb.width
    const py = vb.y + ((e.clientY - rect.top) / rect.height) * vb.height
    vb.x = px - (px - vb.x) * scale
    vb.y = py - (py - vb.y) * scale
    vb.width *= scale
    vb.height *= scale
  }

  let drag = null
  function onPointerDown(e) {
    drag = { cx: e.clientX, cy: e.clientY, vx: vb.x, vy: vb.y, moved: false }
    svg.classList.add("panning")
  }
  function onPointerMove(e) {
    if (!drag) return
    const rect = svg.getBoundingClientRect()
    const dx = ((e.clientX - drag.cx) / rect.width) * vb.width
    const dy = ((e.clientY - drag.cy) / rect.height) * vb.height
    if (Math.abs(e.clientX - drag.cx) + Math.abs(e.clientY - drag.cy) > 3) drag.moved = true
    vb.x = drag.vx - dx
    vb.y = drag.vy - dy
  }
  function onPointerUp() {
    svg.classList.remove("panning")
    setTimeout(() => { drag = null }, 0)
  }

  svg.addEventListener("wheel", onWheel, { passive: false })
  svg.addEventListener("pointerdown", onPointerDown)
  svg.addEventListener("pointermove", onPointerMove)
  svg.addEventListener("pointerup", onPointerUp)
  svg.addEventListener("pointerleave", onPointerUp)

  function connected(id) {
    return layout.edges.filter(edge => edge.from === id || edge.to === id)
  }

  function neighborIds(id) {
    const edges = connected(id)
    return [id, ...edges.flatMap(edge => [edge.id, edge.from === id ? edge.to : edge.from])]
  }

  function markAll(ids, cls) {
    for (const id of ids) {
      const el = svg.querySelector('[data-id="' + CSS.escape(id) + '"]')
      if (el) el.classList.add(cls)
    }
  }

  function relatedIds(id) {
    const node = layout.nodes.find(n => n.id === id)
    if (node) return neighborIds(id)
    const edge = layout.edges.find(ed => ed.id === id)
    return edge ? [edge.id, edge.from, edge.to] : []
  }

  function clearSelection() {
    svg.classList.remove("has-selection")
    svg.querySelectorAll(".hl").forEach(el => el.classList.remove("hl"))
    panel.hidden = true
  }

  function showPanel(id) {
    const node = layout.nodes.find(n => n.id === id)
    const edge = node ? undefined : layout.edges.find(ed => ed.id === id)
    if (!node && !edge) return
    panel.hidden = false
    panelBody.textContent = ""
    const table = document.createElement("table")
    if (node) {
      panelTitle.textContent = node.label
      if (node.rows) {
        for (const row of node.rows) {
          const tr = document.createElement("tr")
          const td = document.createElement("td")
          td.textContent = row.text
          tr.appendChild(td)
          table.appendChild(tr)
        }
      } else {
        for (const [k, v] of Object.entries(node.meta ?? {})) {
          if (v === "" || v === undefined) continue
          const tr = document.createElement("tr")
          const td1 = document.createElement("td")
          const td2 = document.createElement("td")
          td1.textContent = k
          td2.textContent = String(v)
          tr.append(td1, td2)
          table.appendChild(tr)
        }
      }
    } else if (edge) {
      panelTitle.textContent = edge.label || edge.id
      const fields = [["from", edge.from], ["to", edge.to]]
      if (edge.cardinality) fields.push(["cardinality", edge.cardinality])
      if (edge.style) fields.push(["style", edge.style])
      for (const [k, v] of fields) {
        const tr = document.createElement("tr")
        const td1 = document.createElement("td")
        const td2 = document.createElement("td")
        td1.textContent = k
        td2.textContent = v || ""
        tr.append(td1, td2)
        table.appendChild(tr)
      }
    }
    panelBody.appendChild(table)
  }

  function select(id) {
    clearSelection()
    svg.classList.add("has-selection")
    markAll(relatedIds(id), "hl")
    showPanel(id)
  }

  function preview(id) {
    svg.classList.add("has-hover")
    markAll(relatedIds(id), "pv")
  }

  function clearPreview() {
    svg.classList.remove("has-hover")
    svg.querySelectorAll(".pv").forEach(el => el.classList.remove("pv"))
  }

  for (const item of document.querySelectorAll("[data-id]")) {
    item.addEventListener("click", () => select(item.dataset.id))
    item.addEventListener("pointerenter", () => preview(item.dataset.id))
    item.addEventListener("pointerleave", clearPreview)
  }
})()
</script>
</body>
