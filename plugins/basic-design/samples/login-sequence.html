<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ログイン処理シーケンス図(サンプル)</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; }
  main { flex: 1; overflow: hidden; background: #fafafa; }
  svg { width: 100%; height: 100%; cursor: grab; }
  svg.panning { cursor: grabbing; }
  .node-box { fill: #fff; stroke: #333; }
  .node-header { fill: #e8eef7; stroke: #333; }
  .node-title { font-weight: bold; font-size: 13px; }
  .row { font-size: 12px; fill: #222; }
  .edge line { stroke: #666; stroke-width: 1.5; }
  .edge-label { font-size: 11px; fill: #444; }
  .node, .edge { transition: opacity .15s; }
  svg.has-selection .node:not(.hl), svg.has-selection .edge:not(.hl) { opacity: .25; }
  svg.has-hover .node:not(.pv):not(.hl), svg.has-hover .edge:not(.pv):not(.hl) { opacity: .5; }
  .hl .node-box, .pv .node-box { stroke: #1a63c9; stroke-width: 2; }
  .hl line, .pv line { stroke: #1a63c9; stroke-width: 2.5; }
  .zone rect { fill: #f5f5f5; stroke: #666; }
  .zone-label { font-size: 12px; font-weight: bold; fill: #444; }
  .lifeline { stroke: #999; stroke-dasharray: 6 4; }
  .edge.return line { stroke-dasharray: 6 4; }
  .node-header-fill { fill: #e8eef7; }
  #arrow path { fill: #666; }
  aside { width: 280px; border-left: 1px solid #ddd; padding: 12px; overflow-y: auto; background: #fff; }
  aside h2 { font-size: 14px; margin: 0 0 8px; }
  aside table { width: 100%; border-collapse: collapse; font-size: 12px; }
  aside td { border-bottom: 1px solid #eee; padding: 4px 2px; }
</style>
</head>
<body>
<main>
<svg id="canvas" viewBox="0 0 880 510" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#666"/></marker>
</defs>
<g id="zones">

</g>
<g id="lines">
<line class="lifeline" x1="110" y1="90" x2="110" y2="470"/>
<line class="lifeline" x1="330" y1="90" x2="330" y2="470"/>
<line class="lifeline" x1="550" y1="90" x2="550" y2="470"/>
<line class="lifeline" x1="770" y1="90" x2="770" y2="470"/>
</g>
<g id="edges">
<g class="edge sync" data-id="msg1" data-from="user" data-to="web"><line x1="110" y1="140" x2="330" y2="140" marker-end="url(#arrow)"/><text x="220" y="134" text-anchor="middle" class="edge-label">ログイン要求</text></g>
<g class="edge sync" data-id="msg2" data-from="web" data-to="auth"><line x1="330" y1="190" x2="550" y2="190" marker-end="url(#arrow)"/><text x="440" y="184" text-anchor="middle" class="edge-label">認証リクエスト</text></g>
<g class="edge sync" data-id="msg3" data-from="auth" data-to="db"><line x1="550" y1="240" x2="770" y2="240" marker-end="url(#arrow)"/><text x="660" y="234" text-anchor="middle" class="edge-label">ユーザー照会</text></g>
<g class="edge return" data-id="msg4" data-from="db" data-to="auth"><line x1="770" y1="290" x2="550" y2="290" marker-end="url(#arrow-open)"/><text x="660" y="284" text-anchor="middle" class="edge-label">ユーザー情報</text></g>
<g class="edge return" data-id="msg5" data-from="auth" data-to="web"><line x1="550" y1="340" x2="330" y2="340" marker-end="url(#arrow-open)"/><text x="440" y="334" text-anchor="middle" class="edge-label">トークン発行</text></g>
<g class="edge return" data-id="msg6" data-from="web" data-to="user"><line x1="330" y1="390" x2="110" y2="390" marker-end="url(#arrow-open)"/><text x="220" y="384" text-anchor="middle" class="edge-label">ホーム画面表示</text></g>
</g>
<g id="nodes">
<g class="node" data-id="user" transform="translate(40,40)"><rect width="140" height="50" rx="0" class="node-box node-header-fill"/><text x="70" y="25" text-anchor="middle" dominant-baseline="middle" class="node-title">ユーザー</text></g>
<g class="node" data-id="web" transform="translate(260,40)"><rect width="140" height="50" rx="0" class="node-box node-header-fill"/><text x="70" y="25" text-anchor="middle" dominant-baseline="middle" class="node-title">Web アプリ</text></g>
<g class="node" data-id="auth" transform="translate(480,40)"><rect width="140" height="50" rx="0" class="node-box node-header-fill"/><text x="70" y="25" text-anchor="middle" dominant-baseline="middle" class="node-title">認証 API</text></g>
<g class="node" data-id="db" transform="translate(700,40)"><rect width="140" height="50" rx="0" class="node-box node-header-fill"/><text x="70" y="25" text-anchor="middle" dominant-baseline="middle" class="node-title">DB</text></g>
</g>
</svg>
</main>
<aside id="panel" hidden>
<h2 id="panel-title"></h2>
<div id="panel-body"></div>
</aside>
<script type="application/json" id="design-spec">{"type":"sequence","title":"ログイン処理シーケンス図(サンプル)","actors":[{"id":"user","label":"ユーザー","kind":"actor"},{"id":"web","label":"Web アプリ"},{"id":"auth","label":"認証 API"},{"id":"db","label":"DB"}],"messages":[{"from":"user","to":"web","label":"ログイン要求"},{"from":"web","to":"auth","label":"認証リクエスト"},{"from":"auth","to":"db","label":"ユーザー照会"},{"from":"db","to":"auth","label":"ユーザー情報","style":"return"},{"from":"auth","to":"web","label":"トークン発行","style":"return"},{"from":"web","to":"user","label":"ホーム画面表示","style":"return"}]}</script>
<script type="application/json" id="design-layout">{"type":"sequence","title":"ログイン処理シーケンス図(サンプル)","nodes":[{"id":"user","label":"ユーザー","shape":"actor","x":0,"y":0,"width":140,"height":50,"meta":{"kind":"actor"}},{"id":"web","label":"Web アプリ","shape":"actor","x":220,"y":0,"width":140,"height":50,"meta":{"kind":"system"}},{"id":"auth","label":"認証 API","shape":"actor","x":440,"y":0,"width":140,"height":50,"meta":{"kind":"system"}},{"id":"db","label":"DB","shape":"actor","x":660,"y":0,"width":140,"height":50,"meta":{"kind":"system"}}],"lines":[{"x":70,"y1":50,"y2":430,"owner":"user"},{"x":290,"y1":50,"y2":430,"owner":"web"},{"x":510,"y1":50,"y2":430,"owner":"auth"},{"x":730,"y1":50,"y2":430,"owner":"db"}],"edges":[{"id":"msg1","from":"user","to":"web","label":"ログイン要求","style":"sync","fromPt":{"x":70,"y":100},"toPt":{"x":290,"y":100}},{"id":"msg2","from":"web","to":"auth","label":"認証リクエスト","style":"sync","fromPt":{"x":290,"y":150},"toPt":{"x":510,"y":150}},{"id":"msg3","from":"auth","to":"db","label":"ユーザー照会","style":"sync","fromPt":{"x":510,"y":200},"toPt":{"x":730,"y":200}},{"id":"msg4","from":"db","to":"auth","label":"ユーザー情報","style":"return","fromPt":{"x":730,"y":250},"toPt":{"x":510,"y":250}},{"id":"msg5","from":"auth","to":"web","label":"トークン発行","style":"return","fromPt":{"x":510,"y":300},"toPt":{"x":290,"y":300}},{"id":"msg6","from":"web","to":"user","label":"ホーム画面表示","style":"return","fromPt":{"x":290,"y":350},"toPt":{"x":70,"y":350}}]}</script>
<script>
(() => {
  const svg = document.getElementById('canvas');
  const layout = JSON.parse(document.getElementById('design-layout').textContent);
  const panel = document.getElementById('panel');
  const panelTitle = document.getElementById('panel-title');
  const panelBody = document.getElementById('panel-body');
  const vb = svg.viewBox.baseVal;

  // --- ズーム(ポインタ位置を中心に) ---
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const scale = e.deltaY < 0 ? 0.9 : 1.1;
    const rect = svg.getBoundingClientRect();
    const px = vb.x + ((e.clientX - rect.left) / rect.width) * vb.width;
    const py = vb.y + ((e.clientY - rect.top) / rect.height) * vb.height;
    vb.x = px - (px - vb.x) * scale;
    vb.y = py - (py - vb.y) * scale;
    vb.width *= scale;
    vb.height *= scale;
  }, { passive: false });

  // --- パン(ドラッグ) ---
  let drag = null;
  svg.addEventListener('pointerdown', (e) => {
    drag = { cx: e.clientX, cy: e.clientY, vx: vb.x, vy: vb.y, moved: false };
    svg.classList.add('panning');
  });
  window.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const rect = svg.getBoundingClientRect();
    const dx = ((e.clientX - drag.cx) / rect.width) * vb.width;
    const dy = ((e.clientY - drag.cy) / rect.height) * vb.height;
    if (Math.abs(e.clientX - drag.cx) + Math.abs(e.clientY - drag.cy) > 3) drag.moved = true;
    vb.x = drag.vx - dx;
    vb.y = drag.vy - dy;
  });
  window.addEventListener('pointerup', () => {
    svg.classList.remove('panning');
    setTimeout(() => { drag = null; }, 0);
  });

  // --- 接続集合の計算 ---
  function connected(g) {
    const set = new Set([g]);
    if (g.classList.contains('node')) {
      const id = g.dataset.id;
      svg.querySelectorAll('.edge').forEach((eg) => {
        if (eg.dataset.from === id || eg.dataset.to === id) {
          set.add(eg);
          const otherId = eg.dataset.from === id ? eg.dataset.to : eg.dataset.from;
          const other = svg.querySelector('.node[data-id="' + CSS.escape(otherId) + '"]');
          if (other) set.add(other);
        }
      });
    } else {
      for (const key of ['from', 'to']) {
        const n = svg.querySelector('.node[data-id="' + CSS.escape(g.dataset[key]) + '"]');
        if (n) set.add(n);
      }
    }
    return set;
  }

  // --- 選択(クリック) ---
  function clearSelection() {
    svg.classList.remove('has-selection');
    svg.querySelectorAll('.hl').forEach((el) => el.classList.remove('hl'));
    panel.hidden = true;
  }
  svg.addEventListener('click', (e) => {
    if (drag && drag.moved) return; // パン後のクリックは無視
    const g = e.target.closest('.node, .edge');
    clearSelection();
    if (!g) return;
    svg.classList.add('has-selection');
    connected(g).forEach((el) => el.classList.add('hl'));
    showPanel(g);
  });

  // --- ホバー(プレビュー) ---
  svg.addEventListener('pointerover', (e) => {
    const g = e.target.closest('.node, .edge');
    if (!g) return;
    svg.classList.add('has-hover');
    connected(g).forEach((el) => el.classList.add('pv'));
  });
  svg.addEventListener('pointerout', () => {
    svg.classList.remove('has-hover');
    svg.querySelectorAll('.pv').forEach((el) => el.classList.remove('pv'));
  });

  // --- 詳細パネル(レイアウト JSON から図種非依存に描画) ---
  function showPanel(g) {
    panel.hidden = false;
    panelBody.textContent = '';
    if (g.classList.contains('node')) {
      const node = layout.nodes.find((n) => n.id === g.dataset.id);
      panelTitle.textContent = node.label;
      const table = document.createElement('table');
      if (node.rows) {
        for (const row of node.rows) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.textContent = row.text;
          tr.appendChild(td);
          table.appendChild(tr);
        }
      } else {
        for (const [k, v] of Object.entries(node.meta ?? {})) {
          if (v === '' || v === undefined) continue;
          const tr = document.createElement('tr');
          const td1 = document.createElement('td');
          const td2 = document.createElement('td');
          td1.textContent = k;
          td2.textContent = String(v);
          tr.append(td1, td2);
          table.appendChild(tr);
        }
      }
      panelBody.appendChild(table);
    } else {
      const edge = layout.edges.find((ed) => ed.id === g.dataset.id);
      panelTitle.textContent = edge.label || edge.id;
      const dl = document.createElement('table');
      const fields = [['from', edge.from], ['to', edge.to]];
      if (edge.cardinality) fields.push(['cardinality', edge.cardinality]);
      if (edge.style) fields.push(['style', edge.style]);
      for (const [k, v] of fields) {
        const tr = document.createElement('tr');
        const td1 = document.createElement('td');
        const td2 = document.createElement('td');
        td1.textContent = k;
        td2.textContent = v || '';
        tr.append(td1, td2);
        dl.appendChild(tr);
      }
      panelBody.appendChild(dl);
    }
  }
})();
</script>
</body>
</html>
