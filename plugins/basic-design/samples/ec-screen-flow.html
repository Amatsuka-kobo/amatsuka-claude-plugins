<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>EC サイト画面遷移図(サンプル)</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; }
  main { flex: 1; overflow: hidden; background: #fafafa; }
  svg { width: 100%; height: 100%; cursor: grab; }
  svg.panning { cursor: grabbing; }
  .node-box { fill: #fff; stroke: #333; }
  .node-header { fill: #e8eef7; stroke: #333; }
  .node-title { font-weight: bold; font-size: 13px; }
  .row { font-size: 12px; fill: #222; }
  .edge line { stroke: #666; stroke-width: 1.5; }
  .edge-label { font-size: 11px; fill: #444; }
  .node, .edge { transition: opacity .15s; }
  svg.has-selection .node:not(.hl), svg.has-selection .edge:not(.hl) { opacity: .25; }
  svg.has-hover .node:not(.pv):not(.hl), svg.has-hover .edge:not(.pv):not(.hl) { opacity: .5; }
  .hl .node-box, .pv .node-box { stroke: #1a63c9; stroke-width: 2; }
  .hl line, .pv line { stroke: #1a63c9; stroke-width: 2.5; }
  .zone rect { fill: #f5f5f5; stroke: #666; }
  .zone-label { font-size: 12px; font-weight: bold; fill: #444; }
  .lifeline { stroke: #999; stroke-dasharray: 6 4; }
  .edge.return line { stroke-dasharray: 6 4; }
  .node-header-fill { fill: #e8eef7; }
  #arrow path { fill: #666; }
  aside { width: 280px; border-left: 1px solid #ddd; padding: 12px; overflow-y: auto; background: #fff; }
  aside h2 { font-size: 14px; margin: 0 0 8px; }
  aside table { width: 100%; border-collapse: collapse; font-size: 12px; }
  aside td { border-bottom: 1px solid #eee; padding: 4px 2px; }
</style>
</head>
<body>
<main>
<svg id="canvas" viewBox="0 0 1940 140" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#666"/></marker>
</defs>
<g id="zones">

</g>
<g id="lines">

</g>
<g id="edges">
<g class="edge arrow" data-id="t1" data-from="login" data-to="home"><line x1="130" y1="70" x2="410" y2="70" marker-end="url(#arrow)"/><text x="270" y="64" text-anchor="middle" class="edge-label">ログイン成功</text></g>
<g class="edge arrow" data-id="t2" data-from="home" data-to="product-list"><line x1="410" y1="70" x2="690" y2="70" marker-end="url(#arrow)"/><text x="550" y="64" text-anchor="middle" class="edge-label">カテゴリ選択</text></g>
<g class="edge arrow" data-id="t3" data-from="product-list" data-to="product-detail"><line x1="690" y1="70" x2="970" y2="70" marker-end="url(#arrow)"/><text x="830" y="64" text-anchor="middle" class="edge-label">商品選択</text></g>
<g class="edge arrow" data-id="t4" data-from="product-detail" data-to="cart"><line x1="970" y1="70" x2="1250" y2="70" marker-end="url(#arrow)"/><text x="1110" y="64" text-anchor="middle" class="edge-label">カートに入れる</text></g>
<g class="edge arrow" data-id="t5" data-from="cart" data-to="checkout"><line x1="1250" y1="70" x2="1530" y2="70" marker-end="url(#arrow)"/><text x="1390" y="64" text-anchor="middle" class="edge-label">レジへ進む</text></g>
<g class="edge arrow" data-id="t6" data-from="checkout" data-to="order-complete"><line x1="1530" y1="70" x2="1810" y2="70" marker-end="url(#arrow)"/><text x="1670" y="64" text-anchor="middle" class="edge-label">注文確定</text></g>
<g class="edge arrow" data-id="t7" data-from="order-complete" data-to="home"><line x1="1810" y1="70" x2="410" y2="70" marker-end="url(#arrow)"/><text x="1110" y="64" text-anchor="middle" class="edge-label">トップへ戻る</text></g>
</g>
<g id="nodes">
<g class="node" data-id="login" transform="translate(40,40)"><ellipse cx="90" cy="30" rx="90" ry="30" class="node-box"/><text x="90" y="30" text-anchor="middle" dominant-baseline="middle" class="node-title">ログイン</text></g>
<g class="node" data-id="home" transform="translate(320,40)"><rect width="180" height="60" rx="8" class="node-box"/><text x="90" y="30" text-anchor="middle" dominant-baseline="middle" class="node-title">ホーム</text></g>
<g class="node" data-id="product-list" transform="translate(600,40)"><rect width="180" height="60" rx="8" class="node-box"/><text x="90" y="30" text-anchor="middle" dominant-baseline="middle" class="node-title">商品一覧</text></g>
<g class="node" data-id="product-detail" transform="translate(880,40)"><rect width="180" height="60" rx="8" class="node-box"/><text x="90" y="30" text-anchor="middle" dominant-baseline="middle" class="node-title">商品詳細</text></g>
<g class="node" data-id="cart" transform="translate(1160,40)"><rect width="180" height="60" rx="8" class="node-box"/><text x="90" y="30" text-anchor="middle" dominant-baseline="middle" class="node-title">カート</text></g>
<g class="node" data-id="checkout" transform="translate(1440,40)"><rect width="180" height="60" rx="8" class="node-box"/><text x="90" y="30" text-anchor="middle" dominant-baseline="middle" class="node-title">購入手続き</text></g>
<g class="node" data-id="order-complete" transform="translate(1720,40)"><ellipse cx="90" cy="30" rx="90" ry="30" class="node-box"/><text x="90" y="30" text-anchor="middle" dominant-baseline="middle" class="node-title">注文完了</text></g>
</g>
</svg>
</main>
<aside id="panel" hidden>
<h2 id="panel-title"></h2>
<div id="panel-body"></div>
</aside>
<script type="application/json" id="design-spec">{"type":"screen-flow","title":"EC サイト画面遷移図(サンプル)","screens":[{"id":"login","label":"ログイン","group":"認証","kind":"start"},{"id":"home","label":"ホーム"},{"id":"product-list","label":"商品一覧"},{"id":"product-detail","label":"商品詳細"},{"id":"cart","label":"カート"},{"id":"checkout","label":"購入手続き"},{"id":"order-complete","label":"注文完了","kind":"end"}],"transitions":[{"from":"login","to":"home","trigger":"ログイン成功"},{"from":"home","to":"product-list","trigger":"カテゴリ選択"},{"from":"product-list","to":"product-detail","trigger":"商品選択"},{"from":"product-detail","to":"cart","trigger":"カートに入れる"},{"from":"cart","to":"checkout","trigger":"レジへ進む"},{"from":"checkout","to":"order-complete","trigger":"注文確定"},{"from":"order-complete","to":"home","trigger":"トップへ戻る"}]}</script>
<script type="application/json" id="design-layout">{"type":"screen-flow","title":"EC サイト画面遷移図(サンプル)","nodes":[{"id":"login","label":"ログイン","shape":"terminal","x":0,"y":0,"width":180,"height":60,"meta":{"group":"認証","kind":"start"}},{"id":"home","label":"ホーム","shape":"box","x":280,"y":0,"width":180,"height":60,"meta":{"group":"","kind":"screen"}},{"id":"product-list","label":"商品一覧","shape":"box","x":560,"y":0,"width":180,"height":60,"meta":{"group":"","kind":"screen"}},{"id":"product-detail","label":"商品詳細","shape":"box","x":840,"y":0,"width":180,"height":60,"meta":{"group":"","kind":"screen"}},{"id":"cart","label":"カート","shape":"box","x":1120,"y":0,"width":180,"height":60,"meta":{"group":"","kind":"screen"}},{"id":"checkout","label":"購入手続き","shape":"box","x":1400,"y":0,"width":180,"height":60,"meta":{"group":"","kind":"screen"}},{"id":"order-complete","label":"注文完了","shape":"terminal","x":1680,"y":0,"width":180,"height":60,"meta":{"group":"","kind":"end"}}],"edges":[{"id":"t1","from":"login","to":"home","label":"ログイン成功","style":"arrow"},{"id":"t2","from":"home","to":"product-list","label":"カテゴリ選択","style":"arrow"},{"id":"t3","from":"product-list","to":"product-detail","label":"商品選択","style":"arrow"},{"id":"t4","from":"product-detail","to":"cart","label":"カートに入れる","style":"arrow"},{"id":"t5","from":"cart","to":"checkout","label":"レジへ進む","style":"arrow"},{"id":"t6","from":"checkout","to":"order-complete","label":"注文確定","style":"arrow"},{"id":"t7","from":"order-complete","to":"home","label":"トップへ戻る","style":"arrow"}]}</script>
<script>
(() => {
  const svg = document.getElementById('canvas');
  const layout = JSON.parse(document.getElementById('design-layout').textContent);
  const panel = document.getElementById('panel');
  const panelTitle = document.getElementById('panel-title');
  const panelBody = document.getElementById('panel-body');
  const vb = svg.viewBox.baseVal;

  // --- ズーム(ポインタ位置を中心に) ---
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const scale = e.deltaY < 0 ? 0.9 : 1.1;
    const rect = svg.getBoundingClientRect();
    const px = vb.x + ((e.clientX - rect.left) / rect.width) * vb.width;
    const py = vb.y + ((e.clientY - rect.top) / rect.height) * vb.height;
    vb.x = px - (px - vb.x) * scale;
    vb.y = py - (py - vb.y) * scale;
    vb.width *= scale;
    vb.height *= scale;
  }, { passive: false });

  // --- パン(ドラッグ) ---
  let drag = null;
  svg.addEventListener('pointerdown', (e) => {
    drag = { cx: e.clientX, cy: e.clientY, vx: vb.x, vy: vb.y, moved: false };
    svg.classList.add('panning');
  });
  window.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const rect = svg.getBoundingClientRect();
    const dx = ((e.clientX - drag.cx) / rect.width) * vb.width;
    const dy = ((e.clientY - drag.cy) / rect.height) * vb.height;
    if (Math.abs(e.clientX - drag.cx) + Math.abs(e.clientY - drag.cy) > 3) drag.moved = true;
    vb.x = drag.vx - dx;
    vb.y = drag.vy - dy;
  });
  window.addEventListener('pointerup', () => {
    svg.classList.remove('panning');
    setTimeout(() => { drag = null; }, 0);
  });

  // --- 接続集合の計算 ---
  function connected(g) {
    const set = new Set([g]);
    if (g.classList.contains('node')) {
      const id = g.dataset.id;
      svg.querySelectorAll('.edge').forEach((eg) => {
        if (eg.dataset.from === id || eg.dataset.to === id) {
          set.add(eg);
          const otherId = eg.dataset.from === id ? eg.dataset.to : eg.dataset.from;
          const other = svg.querySelector('.node[data-id="' + CSS.escape(otherId) + '"]');
          if (other) set.add(other);
        }
      });
    } else {
      for (const key of ['from', 'to']) {
        const n = svg.querySelector('.node[data-id="' + CSS.escape(g.dataset[key]) + '"]');
        if (n) set.add(n);
      }
    }
    return set;
  }

  // --- 選択(クリック) ---
  function clearSelection() {
    svg.classList.remove('has-selection');
    svg.querySelectorAll('.hl').forEach((el) => el.classList.remove('hl'));
    panel.hidden = true;
  }
  svg.addEventListener('click', (e) => {
    if (drag && drag.moved) return; // パン後のクリックは無視
    const g = e.target.closest('.node, .edge');
    clearSelection();
    if (!g) return;
    svg.classList.add('has-selection');
    connected(g).forEach((el) => el.classList.add('hl'));
    showPanel(g);
  });

  // --- ホバー(プレビュー) ---
  svg.addEventListener('pointerover', (e) => {
    const g = e.target.closest('.node, .edge');
    if (!g) return;
    svg.classList.add('has-hover');
    connected(g).forEach((el) => el.classList.add('pv'));
  });
  svg.addEventListener('pointerout', () => {
    svg.classList.remove('has-hover');
    svg.querySelectorAll('.pv').forEach((el) => el.classList.remove('pv'));
  });

  // --- 詳細パネル(レイアウト JSON から図種非依存に描画) ---
  function showPanel(g) {
    panel.hidden = false;
    panelBody.textContent = '';
    if (g.classList.contains('node')) {
      const node = layout.nodes.find((n) => n.id === g.dataset.id);
      panelTitle.textContent = node.label;
      const table = document.createElement('table');
      if (node.rows) {
        for (const row of node.rows) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.textContent = row.text;
          tr.appendChild(td);
          table.appendChild(tr);
        }
      } else {
        for (const [k, v] of Object.entries(node.meta ?? {})) {
          if (v === '' || v === undefined) continue;
          const tr = document.createElement('tr');
          const td1 = document.createElement('td');
          const td2 = document.createElement('td');
          td1.textContent = k;
          td2.textContent = String(v);
          tr.append(td1, td2);
          table.appendChild(tr);
        }
      }
      panelBody.appendChild(table);
    } else {
      const edge = layout.edges.find((ed) => ed.id === g.dataset.id);
      panelTitle.textContent = edge.label || edge.id;
      const dl = document.createElement('table');
      const fields = [['from', edge.from], ['to', edge.to]];
      if (edge.cardinality) fields.push(['cardinality', edge.cardinality]);
      if (edge.style) fields.push(['style', edge.style]);
      for (const [k, v] of fields) {
        const tr = document.createElement('tr');
        const td1 = document.createElement('td');
        const td2 = document.createElement('td');
        td1.textContent = k;
        td2.textContent = v || '';
        tr.append(td1, td2);
        dl.appendChild(tr);
      }
      panelBody.appendChild(dl);
    }
  }
})();
</script>
</body>
</html>
